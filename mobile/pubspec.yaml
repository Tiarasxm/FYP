name: shaperush_mobile
description: ShapeRush mobile app frontend (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.16.0
  intl: ^0.19.0
  image_picker: ^1.2.1
  camera: ^0.12.0+2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/shaperush_bg.png
